# AlertManager 配置文件

global:
  resolve_timeout: 5m

# 路由配置
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
    - match:
        severity: warning
      receiver: 'warning'

# 接收器配置
# 珠算 API 不提供告警接收 webhook；默认只保留路由，不发送到不存在的接口。
# 接入实际通知服务后，再在对应 receiver 下启用 webhook_configs / email_configs。
receivers:
  - name: 'default'
  - name: 'critical'
    # webhook_configs:
    #   - url: 'https://alerts.example.com/receiver'
    #     send_resolved: true
  - name: 'warning'

# 抑制规则
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']
