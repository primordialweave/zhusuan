# Prometheus 配置文件

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'zhusuan-api'
    environment: 'production'

# 告警规则文件
rule_files:
  - '/etc/prometheus/alerts.yml'

# AlertManager配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# 抓取配置
scrape_configs:
  # 珠算 API 应用监控
  - job_name: 'zhusuan-api'
    static_configs:
      - targets: ['host.docker.internal:3456']  # Compose 为 Linux 配置 host-gateway；桌面 Docker 也支持此名称
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Prometheus 自监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Redis 与节点监控可在提供对应 exporter 后启用。
  # Redis 的 6379 端口不是 HTTP metrics 服务。
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['node-exporter:9100']
