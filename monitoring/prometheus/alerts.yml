# Prometheus 告警规则

groups:
  - name: api_alerts
    interval: 30s
    rules:
      # 高错误率告警
      - alert: HighErrorRate
        expr: |
          sum by (job, instance) (rate(http_requests_total{job="zhusuan-api",status=~"5.."}[5m]))
          / sum by (job, instance) (rate(http_requests_total{job="zhusuan-api"}[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "API错误率过高"
          description: "{{ $labels.instance }} 的5xx错误比例超过5% (当前比例: {{ $value | humanizePercentage }})"

      # 响应时间过慢
      - alert: SlowAPIResponse
        expr: histogram_quantile(0.99, sum by (job, instance, le) (rate(http_request_duration_seconds_bucket{job="zhusuan-api"}[5m]))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API响应时间过慢"
          description: "{{ $labels.instance }} 的P99响应时间超过1秒 (当前值: {{ $value | humanize }}s)"

      # 服务不可用
      - alert: ServiceDown
        expr: up{job="zhusuan-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "服务不可用"
          description: "{{ $labels.instance }} 无法访问"

      # 高请求量
      - alert: HighRequestRate
        expr: sum by (job, instance) (rate(http_requests_total{job="zhusuan-api"}[5m])) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "请求量过高"
          description: "{{ $labels.instance }} 的请求量超过100 req/s (当前值: {{ $value }})"

  # 数据库连接数与缓存命中率没有对应的应用指标；接入 exporter 后再添加规则。
  # Redis 抓取任务默认未启用，不能把空的 up{job="redis"} 当作健康检查。
