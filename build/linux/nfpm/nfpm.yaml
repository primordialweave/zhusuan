# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "zhusuan"
arch: ${GOARCH}
platform: "linux"
version: "1.1.0"
section: "default"
priority: "extra"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "PrimordialWeave zhusuan Desktop App"
vendor: "PrimordialWeave"
homepage: "https://wails.io"
license: "MIT"
release: "1"
replaces:
  - orange
conflicts:
  - orange

contents:
  - src: "./bin/zhusuan"
    dst: "/usr/local/bin/zhusuan"
  - src: "./build/linux/icons/128/zhusuan.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/zhusuan.png"
  - src: "./build/linux/icons/256/zhusuan.png"
    dst: "/usr/share/icons/hicolor/256x256/apps/zhusuan.png"
  - src: "./build/linux/icons/512/zhusuan.png"
    dst: "/usr/share/icons/hicolor/512x512/apps/zhusuan.png"
  - src: "./build/linux/zhusuan.desktop"
    dst: "/usr/share/applications/zhusuan.desktop"

# Default dependencies for Wails 3.1 GTK4/WebKitGTK 6.0 (Ubuntu 24.04+/Debian 13+)
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

# Distribution-specific overrides for different package formats and WebKit versions
overrides:
  # RPM packages using the GTK4/WebKitGTK 6.0 stack
  rpm:
    replaces:
      - Orange
      - orange
    conflicts:
      - Orange
      - orange
    depends:
      - gtk4
      - webkitgtk6.0

  # Arch Linux packages (WebKitGTK 6.0)
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  # You can also add preremove, postremove if needed
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

