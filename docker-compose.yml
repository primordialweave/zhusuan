version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/primordialweave/zhusuan:${ZHUSUAN_VERSION:-main}
    container_name: zhusuan-app
    restart: unless-stopped
    ports:
      - "3456:3456"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - ENV=production
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in production}
      - TOKEN_EXPIRY=${TOKEN_EXPIRY:-24}
      - APP_SLOGAN=${APP_SLOGAN:-心中有数，账目有序}
      - APP_WECHAT_PUBLIC_ACCOUNT=${APP_WECHAT_PUBLIC_ACCOUNT:-原初织界}
      - GITHUB_REPO=${GITHUB_REPO:-primordialweave/zhusuan}
      - DB_TYPE=${DB_TYPE:-sqlite}
      # Existing container databases must keep their explicit in-container path.
      - DB_PATH=${DB_PATH:-/app/data/zhusuan.db}
      - ALLOW_PRODUCTION_SQLITE=${ALLOW_PRODUCTION_SQLITE:-false}
      - DB_HOST=${DB_HOST:-}
      - DB_PORT=${DB_PORT:-0}
      - DB_USER=${DB_USER:-}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_NAME=${DB_NAME:-zhusuan}
      - DB_SSL_MODE=${DB_SSL_MODE:-disable}
      - ENABLE_API_SERVER=${ENABLE_API_SERVER:-true}
      - API_SERVER_PORT=3456
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173}
      - LOG_ENABLE=${LOG_ENABLE:-true}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_PATH=/app/logs/app.log
      # /metrics 端点的 Basic Auth 凭据，生产环境建议设置
      - PROMETHEUS_USER=${PROMETHEUS_USER:-}
      - PROMETHEUS_PASSWORD=${PROMETHEUS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3456/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  postgres:
    image: postgres:15-alpine
    container_name: zhusuan-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-zhusuan}
      - POSTGRES_USER=${DB_USER:-zhusuan}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 仅绑定本机回环地址，避免数据库端口暴露到外部网络
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-zhusuan} -d ${DB_NAME:-zhusuan}"]
      interval: 10s
      timeout: 3s
      retries: 3
    profiles:
      - postgres

  mysql:
    image: mysql:8.0-debian
    container_name: zhusuan-mysql
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${DB_NAME:-zhusuan}
      - MYSQL_USER=${DB_USER:-zhusuan}
      - MYSQL_PASSWORD=${DB_PASSWORD:-}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-}
    volumes:
      - mysqldata:/var/lib/mysql
    ports:
      # 仅绑定本机回环地址，避免数据库端口暴露到外部网络
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 3s
      retries: 3
    profiles:
      - mysql

volumes:
  pgdata:
    name: zhusuan-pgdata
  mysqldata:
    name: zhusuan-mysqldata
