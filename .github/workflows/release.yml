name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      build_recipe_ref:
        description: Optional reviewed main commit SHA for packaging-only recovery (application source stays at tag)
        required: false
        type: string
      test_recipe_ref:
        description: Optional reviewed main commit SHA for platform-correct test fixtures (application source stays at tag)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Validate tag and release tooling
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s scripts -p "test_*.py"
          VERSION=$(python3 scripts/release.py metadata "$RELEASE_TAG")
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          if gh release view "$RELEASE_TAG" --json isDraft > existing-release.json 2> release-lookup.error; then
            python3 -c "import json; assert json.load(open('existing-release.json'))['isDraft'], 'Refusing to rebuild a published release'"
          elif ! grep -q 'release not found' release-lookup.error; then
            cat release-lookup.error
            exit 1
          fi
          test -f scripts/build_macos_packages.py || { echo 'Tag does not contain the architecture-specific macOS package builder'; exit 1; }
          printf 'tag=%s\nversion=%s\n' "$RELEASE_TAG" "$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: darwin
          - runner: ubuntu-24.04
            platform: linux
          - runner: windows-2025
            platform: windows
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      BUILD_RECIPE_REF: ${{ inputs.build_recipe_ref }}
      TEST_RECIPE_REF: ${{ inputs.test_recipe_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
        env:
          # Preserve repository bytes on Windows; raw CSS contract tests require LF.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
      - name: Apply reviewed packaging recipes
        if: env.BUILD_RECIPE_REF != ''
        shell: bash
        run: |
          [[ "$BUILD_RECIPE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'Recipe ref must be a complete commit SHA'; exit 1; }
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main' "$BUILD_RECIPE_REF"
          git merge-base --is-ancestor "$BUILD_RECIPE_REF" origin/main
          for recipe in build/Taskfile.yml build/darwin/Taskfile.yml build/windows/Taskfile.yml build/linux/Taskfile.yml; do
            git show "${BUILD_RECIPE_REF}:${recipe}" > "$recipe"
          done
          git diff --stat
      - name: Apply reviewed platform test fixtures
        if: env.TEST_RECIPE_REF != ''
        shell: bash
        run: |
          [[ "$TEST_RECIPE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'Test recipe ref must be a complete commit SHA'; exit 1; }
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main' "$TEST_RECIPE_REF"
          git merge-base --is-ancestor "$TEST_RECIPE_REF" origin/main
          for fixture in internal/app/bootstrap_test.go internal/config/data_migration_test.go internal/desktop/legacy_preferences_test.go internal/updater/install_test.go scripts/windows-installer-smoke.ps1; do
            git show "${TEST_RECIPE_REF}:${fixture}" > "$fixture"
          done
          git diff --stat
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize release version
        shell: bash
        run: python scripts/release.py metadata "$RELEASE_TAG"
      - name: Install Linux packaging dependencies
        timeout-minutes: 10
        if: matrix.platform == 'linux'
        run: bash scripts/install-linux-deps.sh rpm
      - name: Install Windows packaging dependencies
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          'C:\Program Files (x86)\NSIS' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'C:\Program Files (x86)\NSIS\Bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install pinned build tools
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.55
          go install github.com/go-task/task/v3/cmd/task@v3.51.1
      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          node node_modules/eslint/bin/eslint.js src --max-warnings=0
          npm run test:run -- --maxWorkers=1
      - name: Build Apple Silicon and Intel macOS packages
        if: matrix.platform == 'darwin'
        run: |
          mkdir -p release
          for arch in arm64 amd64; do
            task darwin:package:app ARCH="$arch"
            python3 scripts/build_macos_packages.py --app bin/珠算.app --arch "$arch" --tag "$RELEASE_TAG" --output release
          done
      - name: Build Windows installer
        if: matrix.platform == 'windows'
        run: task windows:package ARCH=amd64
      - name: Verify Windows standard-user installation
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/windows-standard-user-installer-smoke.ps1 -Installer bin/zhusuan-amd64-installer.exe
      - name: Verify Windows installation and upgrade
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/windows-installer-smoke.ps1 -Installer bin/zhusuan-amd64-installer.exe
      - name: Verify Windows native controls and fullscreen
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/windows-window-smoke.ps1 -Executable bin/zhusuan.exe
      - name: Retain Windows installer failure diagnostics
        if: failure() && matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-diagnostics
          path: |
            bin/zhusuan-amd64-installer.exe
            ${{ runner.temp }}/zhusuan-installer-diagnostics/*
            ${{ runner.temp }}/zhusuan-standard-user-installation.json
            ${{ runner.temp }}/zhusuan-window-check/*
          if-no-files-found: warn
          retention-days: 7
      - name: Build Linux packages
        if: matrix.platform == 'linux'
        env:
          GOARCH: amd64
        run: task linux:package ARCH=amd64
      - name: Verify backend
        shell: bash
        run: |
          go test -mod=readonly . ./internal/... ./cmd/...
          go vet -mod=readonly . ./internal/... ./cmd/...
          git diff --exit-code -- go.mod go.sum
      - name: Prepare and checksum required assets
        shell: bash
        run: python scripts/release.py assets "$RELEASE_TAG" "${{ matrix.platform }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      BUILD_RECIPE_REF: ${{ inputs.build_recipe_ref }}
      TEST_RECIPE_REF: ${{ inputs.test_recipe_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Verify complete release and generate notes
        run: |
          python3 scripts/release.py verify "$RELEASE_TAG"
          python3 scripts/release.py notes "$RELEASE_TAG"
          if [ -n "$BUILD_RECIPE_REF" ]; then
            printf '\n构建来源：应用源码保持在 `%s`；构建配方来自已审查的主分支提交 `%s`。\n' "$RELEASE_TAG" "$BUILD_RECIPE_REF" >> RELEASE_NOTES.md
          fi
          if [ -n "$TEST_RECIPE_REF" ]; then
            printf '\n平台测试夹具来自已审查的主分支提交 `%s`；发行应用源码未替换。\n' "$TEST_RECIPE_REF" >> RELEASE_NOTES.md
          fi
          python3 scripts/release.py manifest "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"
          python3 scripts/release.py verify "$RELEASE_TAG" --manifest --repository "$GITHUB_REPOSITORY"
          if gh release view "$RELEASE_TAG" --json isDraft > existing-release.json 2>/dev/null; then
            python3 -c "import json; assert json.load(open('existing-release.json'))['isDraft'], 'Refusing to overwrite a published release'"
          fi
      - name: Upload all assets to a draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: 珠算 ${{ needs.prepare.outputs.version }}
          draft: true
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            release/zhusuan-*
            release/SHA256SUMS
            release/update.json
      - name: Verify uploaded assets before publishing
        run: |
          gh release view "$RELEASE_TAG" --json isDraft,assets > uploaded-release.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('uploaded-release.json').read_text())
          expected = {p.name: p.stat().st_size for p in Path('release').iterdir() if p.name.startswith('zhusuan-') or p.name in {'SHA256SUMS', 'update.json'}}
          actual = {asset['name']: asset['size'] for asset in data['assets']}
          assert data['isDraft'] and actual == expected, 'Uploaded draft assets do not match the verified release'
          PY
          gh release edit "$RELEASE_TAG" --draft=false --latest
