name: CI

on:
  push:
    branches: [main, develop, code-review-fixes]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release tooling
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Install, lint, test and build frontend
        working-directory: frontend
        run: |
          npm ci
          node node_modules/eslint/bin/eslint.js src --max-warnings=0
          npm run test:run
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  backend:
    runs-on: ubuntu-24.04
    needs: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux desktop dependencies
        timeout-minutes: 10
        run: bash scripts/install-linux-deps.sh
      - name: Verify Go dependencies
        run: |
          go mod download
          go mod verify
      - name: Test backend and verify application packages
        run: |
          go test -mod=readonly -race -coverprofile=coverage.out -covermode=atomic . ./internal/... ./cmd/...
          go vet -mod=readonly . ./internal/... ./cmd/...
          go build -mod=readonly -tags production -trimpath -o zhusuan-linux-amd64 .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -mod=readonly -tags production -trimpath -ldflags="-w -s -H windowsgui" -o zhusuan-windows-amd64.exe .
          go tool cover -html=coverage.out -o coverage.html
      - name: Select baseline for newly introduced static issues
        if: always()
        id: lint-base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            REVISION=$(git rev-parse "$PR_BASE_SHA")
          elif [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != 0000000000000000000000000000000000000000 ]; then
            REVISION=$(git rev-parse "$PUSH_BEFORE_SHA")
          else
            REVISION=$(git rev-parse HEAD^)
          fi
          git cat-file -e "$REVISION^{commit}" || git fetch --no-tags origin "$REVISION"
          printf 'revision=%s\n' "$REVISION" >> "$GITHUB_OUTPUT"
      - name: Reject newly introduced static issues
        if: always()
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.9.0
          args: --timeout=5m --new-from-rev=${{ steps.lint-base.outputs.revision }} . ./internal/... ./cmd/...
      - name: Retain complete static-analysis report
        if: always()
        continue-on-error: true
        run: golangci-lint run --timeout=5m --output.json.path=golangci-full.json --output.text.path=golangci-full.txt . ./internal/... ./cmd/...
      - uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-checks
          path: |
            coverage.out
            coverage.html
            zhusuan-linux-amd64
            zhusuan-windows-amd64.exe
            golangci-full.json
            golangci-full.txt
          retention-days: 7

  security:
    runs-on: ubuntu-24.04
    needs: frontend
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Linux desktop dependencies
        timeout-minutes: 10
        run: bash scripts/install-linux-deps.sh
      - name: Run pinned Gosec scanner
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          gosec -no-fail -fmt sarif -out results.sarif . ./internal/... ./cmd/...
      - name: Upload security results
        if: always() && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
      - name: Scan dependencies and files
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: results.sarif
          retention-days: 7

  docker:
    name: Build Docker Image
    runs-on: ubuntu-24.04
    needs: [backend, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/primordialweave/zhusuan
          tags: |
            type=ref,event=branch
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
